# ============================================
# DevCareer OS - Application Configuration
# ============================================

# Server port -> backend runs at http://localhost:8080
server.port=8080

# ---------------- MySQL Database ----------------
# Change the username/password below to match your local MySQL installation.
# The database "devcareer_os" must exist before you run the app
# (see /database/setup.sql).
spring.datasource.url=jdbc:mysql://localhost:3306/devcareer_os?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Hamsiny@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
# "update" = Hibernate will automatically create/update tables based on our
# @Entity classes every time the app starts. Great for local development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- JWT Settings ----------------
# Secret key used to sign JWT tokens (must be at least 256 bits for HS256).
# Change this to your own random string before using this in anything real.
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForDevCareerOS2026
# Token validity: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# ---------------- CORS ----------------
# Allows the React dev server (default Vite port) to call this API
app.cors.allowed-origin=http://localhost:5173

# ---------------- Logging ----------------
logging.level.org.springframework.security=INFO
logging.level.com.devcareeros=DEBUG
